[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractify"
version = "0.1.2"
description = "Agent-written abstraction graphs over a codebase (MCP + live UI)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abstractify" }]
dependencies = [
  "mcp>=1.0",
  "starlette>=0.38",
  "uvicorn>=0.30",
  "sqlite-vec>=0.1.6",
]

[project.optional-dependencies]
local = ["fastembed>=0.9.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
abstractify = "abstractify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abstractify = [
  "schema.sql",
  "skills/*.md",
  "ui/dist/**",
  "ui/index.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
